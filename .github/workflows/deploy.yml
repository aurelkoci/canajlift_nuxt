name: Deploy Nuxt App to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate static site
        run: bun run generate
        env:
          # Hiqe ose lëre këtë rresht në varësi të faktit nëse përdor custom domain (canajlift.al -> lëre bosh ose fshi NUXT_APP_BASE_URL)
          # Nëse është nën-folder (username.github.io/repo-name/), lëre poshtë:
          NUXT_APP_BASE_URL: https://canajlift.al

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4